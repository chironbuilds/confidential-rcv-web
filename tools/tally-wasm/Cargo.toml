[package]
name = "rcv-tally-wasm"
version = "0.1.0"
edition = "2024"
description = "The confidential voting template tally (rcv-tally) compiled to WASM, so results are recomputed from on-chain ballots with the same code the template runs"

[lib]
crate-type = ["cdylib"]

[dependencies]
rcv-tally = { path = "../../../confidential-vote-template/tally" }
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
